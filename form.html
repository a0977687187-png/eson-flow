<header class="card head formhead noprint">

    <img class="wordmark sm" src="logo.png" width="222" height="71" alt="億新精機廠">

      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">

<div class="printonly phead">

  <span>FM-PT-01　版次 B4（做法主檔）　│　一筆＝一個成品料號的做法　│　接單時印出給現場照做，不隨貨、不交回</span>

<footer class="noprint note">
  <span id="rule"></span><br>
  鑄鋁規格、鉚高、端徑目前沒有專屬欄位，請寫在「其他備註」。<br>
  欄位由 <code>製程流動單8.28.xlsx</code> 同步產生；要改欄位請改那個檔，再跑 <code>更新流動單.bat</code>。

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="config.js?v=1789098981"></script>
<script src="banner.js?v=1789098981"></script>
<script src="fields.js?v=1789098981"></script>
<script type="module">
import { requireLogin, get, create, update, derive, samePn, diffRecipe, meta } from './db.js?v=1789098981';

const qs = new URLSearchParams(location.search);
let NO = qs.get('no') || '';
let KIND = qs.get('kind') === 'RO' ? 'RO' : 'ST';
let D = {};
let dirty = false;
// 已經出現過的客戶名。主頁是照這一欄分資料夾的，「將凱」跟「將凱(22T)」
// 會變成兩個資料夾，所以這裡讓你用選的——但不擋新客戶，照打就是。
// 名單不是預建的主檔，是已經存在的單自己長出來的。
let CUSTS = [];

const draftKey = () => 'eson-draft-' + (NO || 'new-' + KIND);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Know-how 多行格。後面跟一個 .pv 是列印用的鏡像：textarea 印出來只有框的高度，
// 字多了會被切掉；鏡像是普通的 div，字有多少就長多高，印兩頁也不吃字。
const noteBox = (k, v, ph) =>
  `<textarea data-k="${k}" rows="2" placeholder="${esc(ph)}">${esc(v)}</textarea><div class="pv">${esc(v)}</div>`;
const grow = el => { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; };

function field(f) {
  const cls = 'f' + (f.w === 2 ? ' w2' : f.w === 4 ? ' w4' : '');
  const v = D[f.k] || '';
  const opts = f.list || LISTS[f.listName] || [];
  let inner;
  if (f.type === 'select') {
    inner = `<select data-k="${f.k}"><option value=""></option>` +
      opts.map(o => `<option${v === o ? ' selected' : ''}>${esc(o)}</option>`).join('') +
      `<option${v === '其他' ? ' selected' : ''}>其他</option></select>`;
  } else if (f.type === 'yesno') {
    // 「□有＿＿□無」：值只存一個——'無'、'有'、或底線上打的字（打了字就代表有）
    const has = v !== '' && v !== '無';
    const txt = has && v !== '有' ? v : '';
    inner = `<div class="yn" data-yn="${f.k}">
      <label><input type="radio" name="${f.k}" value="有"${has ? ' checked' : ''}>有</label>
      <input type="text" value="${esc(txt)}" placeholder="有什麼">
      <label><input type="radio" name="${f.k}" value="無"${v === '無' ? ' checked' : ''}>無</label></div>`;
  } else if (f.type === 'checks' || f.type === 'radio') {
    const cur = f.type === 'checks' ? (v ? v.split('|') : []) : [v];
    inner = '<div class="opts">' + opts.map(o =>
      `<label><input type="${f.type === 'checks' ? 'checkbox' : 'radio'}" name="${f.k}" value="${esc(o)}" data-k="${f.k}" data-multi="${f.type === 'checks' ? 1 : 0}"${cur.includes(o) ? ' checked' : ''}>${esc(o)}</label>`
    ).join('') + '</div>';
  } else if (f.type === 'note') {
    inner = noteBox(f.k, v, '重點、要注意的地方、下次照著做的方法（可以按 Enter 換行分點寫）');
  } else {
    // 客戶那一格接一份既有客戶清單：打字時跳出來讓你選，選了才不會分岔成兩個資料夾
    const dl = f.k === 'cust' ? ' list="dl-cust" autocomplete="off"' : '';
    inner = `<input type="text" data-k="${f.k}" value="${esc(v)}"${dl}>`;
  }
  return `<div class="${cls}"><label>${esc(f.l)}</label>${inner}${f.note ? `<div class="note">${esc(f.note)}</div>` : ''}</div>`;
}

// B4 做法主檔：加工站只剩「走過哪些站」與「這一站的重點 Know-how」。
// 日期、完成數、不良數、檢驗、簽名那五欄是批次紀錄，已隨改版拿掉。
// 9/10 第三欄由「設備／爐號・溫度時間」改成 Know-how，欄名跟著 Excel 走；
// 欄位鍵仍是 st*_eq，之前打的爐號溫度會原封不動出現在這一格。
function stationTable(list, passcol, notecol) {
  let h = `<div class="tw"><table><thead><tr><th>工　站</th><th class="na">${esc(passcol)}</th>
    <th>${esc(notecol || '重點 Know-how')}</th></tr></thead><tbody>`;
  list.forEach((s, i) => {
    const cur = D['st' + i + '_pass'] || '';
    const opts = s.pass_opts && s.pass_opts.length ? s.pass_opts : ['有', '無'];
    h += `<tr><td class="st">${esc(s.name)}</td>
      <td class="na"><div class="opts">` + opts.map(o =>
        `<label><input type="radio" name="st${i}_pass" value="${esc(o)}" data-k="st${i}_pass" data-multi="0"${cur === o ? ' checked' : ''}>${esc(o)}</label>`
      ).join('') + `</div></td>
      <td>${noteBox('st' + i + '_eq', D['st' + i + '_eq'] || '', '這一站的重點、爐號溫度時間、要注意的地方')}</td></tr>`;
  });
  return h + '</tbody></table></div>';
}

function render() {
  document.getElementById('pkind').textContent = KIND === 'ST' ? '【靜子 ST】' : '【轉子 RO】';
  document.getElementById('ptitle').textContent = KIND === 'ST' ? '靜子 ST 做法' : '轉子 RO 做法';
  document.getElementById('noTag').textContent = NO || '新單（未儲存）';
  document.getElementById('bST').setAttribute('aria-pressed', KIND === 'ST');
  document.getElementById('bRO').setAttribute('aria-pressed', KIND === 'RO');
  document.getElementById('segKind').style.display = NO ? 'none' : '';
  const datalist = `<datalist id="dl-cust">${CUSTS.map(c => `<option value="${esc(c)}"></option>`).join('')}</datalist>`;
  document.getElementById('form').innerHTML = datalist + sections(KIND).map(s => {
    let bodyHtml = '';
    if (s.stations) bodyHtml += stationTable(s.stations, s.passcol, s.notecol);
    if (s.f.length) bodyHtml += '<div class="grid">' + s.f.map(field).join('') + '</div>';
    return `<section><div class="sh sh--${esc(s.tone || 'navy')}">${esc(s.t)}${s.who ? `<span class="who">${esc(s.who)}</span>` : ''}</div>${bodyHtml}</section>`;
  }).join('');
  // 轉子那張 Excel 沒有結尾的填寫規定，借靜子的顯示——規定本來就兩張單通用
  document.getElementById('rule').textContent = formRule(KIND) || formRule('ST');
  bind();
  progress();
  icons();
}

// 完整度就顯示在單子上面，並且直接說「還差哪幾格」。
// 沒有那道製程就勾「無」——勾了就算答過，不用為了衝 100% 亂填。
function progress() {
  const { complete, missing } = derive(D, KIND);
  const cls = complete > 85 ? 'hi' : complete > 50 ? 'mid' : 'lo';
  document.getElementById('prog').innerHTML = `<div class="progbar ${cls}">
    <b>做法完整度 ${complete}%</b>
    <div class="track"><i style="width:${complete}%"></i></div>
    <span>${missing.length
      ? '還沒答 ' + missing.length + ' 格：' + esc(missing.join('、'))
      : '這一筆已經答完了'}</span></div>`;
}

// 「其餘皆無」：把還沒答、而且選項裡本來就有「無」的欄位一次勾完。
// 加「無」是為了讓「確定不做」跟「還沒填」分得開，但十幾格一格一格點很煩。
function restNone() {
  const items = FORM[KIND];
  const done = [];
  for (const i of items) {
    if (i.op !== 'field') continue;
    const opts = i.list || LISTS[i.listName] || [];
    if (!opts.includes('無') || String(D[i.k] || '').trim()) continue;
    D[i.k] = '無'; done.push(i.l);
  }
  const st = (items.find(i => i.op === 'stations') || { list: [] }).list;
  st.forEach((s, idx) => {
    const k = 'st' + idx + '_pass';
    if (String(D[k] || '').trim() || D['st' + idx + '_na']) return;
    if (!(s.pass_opts && s.pass_opts.length ? s.pass_opts : ['有', '無']).includes('無')) return;
    D[k] = '無'; done.push(s.name.replace(/\s/g, ''));
  });
  return done;
}

// 一個成品料號就是一種做法。同號不同做法一定有一邊是錯的，存完立刻回頭比一次。
async function checkPn() {
  const box = document.getElementById('clash');
  const pn = String(D.pnfin || '').trim();
  box.innerHTML = '';
  if (!pn) return;
  let others;
  try { others = await samePn(NO, pn); } catch (e) { return; }
  if (!others.length) return;
  const bad = others.map(o => ({ o, diff: diffRecipe(D, o.data, KIND) })).filter(x => x.diff.length);
  if (!bad.length) {
    box.innerHTML = `<div class="warnbox dup"><b>成品料號 ${esc(pn)} 已經有別筆了</b>
      ${esc(others.map(o => o.no).join('、'))} 用同一個料號，做法也一樣。
      要留兩筆還是刪一筆，你決定。</div>`;
    return;
  }
  const { o, diff } = bad[0];
  box.innerHTML = `<div class="warnbox"><b>成品料號 ${esc(pn)} 撞號，但做法不一樣</b>
    ${esc(o.no)} 用同一個成品料號，下面這 ${diff.length} 個地方寫得不同——
    一定有一邊是錯的，或是這兩個本來就該分成不同料號。
    <table class="difftab"><thead><tr><th>欄位</th><th>這一筆</th><th>${esc(o.no)}</th></tr></thead>
    <tbody>${diff.map(x => `<tr><td>${esc(x.label)}</td><td>${esc(x.a)}</td><td>${esc(x.b)}</td></tr>`).join('')}</tbody>
    </table></div>`;
}

function bind() {
  document.querySelectorAll('[data-k]').forEach(el => {
    if (el.tagName === 'TEXTAREA') grow(el);
    const ev = el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      const k = el.dataset.k;
      if (el.type === 'checkbox' && el.dataset.multi === '1') {
        D[k] = [...document.querySelectorAll(`[data-k="${k}"]:checked`)].map(x => x.value).join('|');
      } else if (el.type === 'checkbox') {
        D[k] = el.checked ? el.value : '';
      } else {
        D[k] = el.value;
        // 多行格：跟著字長高，順便更新列印用的鏡像
        if (el.tagName === 'TEXTAREA') { grow(el); el.nextElementSibling.textContent = el.value; }
      }
      touched();
    });
  });
  bindYesNo();
}

// 改了任何一格之後都要做的事：標記未存、存草稿、重算完整度、排自動儲存
function touched() {
  dirty = true;
  localStorage.setItem(draftKey(), JSON.stringify(D));
  markDirty();
  progress();
  scheduleSave();
}

// 「□有＿＿□無」的三個零件合成一個值。打字就自動勾「有」；點「無」把字清掉。
function bindYesNo() {
  document.querySelectorAll('.yn').forEach(box => {
    const k = box.dataset.yn;
    const yes = box.querySelector('input[value="有"]');
    const no = box.querySelector('input[value="無"]');
    const t = box.querySelector('input[type="text"]');
    const commit = () => {
      D[k] = no.checked ? '無' : (t.value.trim() || (yes.checked ? '有' : ''));
      touched();
    };
    t.addEventListener('input', () => { if (t.value.trim()) yes.checked = true; commit(); });
    yes.addEventListener('change', commit);
    no.addEventListener('change', () => { t.value = ''; commit(); });
  });
}

// 只換按鈕裡的文字，不要動到圖示
const markDirty = () => {
  document.querySelector('#btnSave span').textContent = dirty ? '儲存 ●' : '儲存';
};
const icons = () => { try { lucide.createIcons(); } catch (e) {} };

// ── 自動儲存 ──────────────────────────────────────────────
// 停手 1.2 秒就自己存。但空白的不會自動建——至少要填了客戶、模具編號或
// 模具規格其中一個，否則手滑點一下就會生出一堆空筆。
// （B4 改版拿掉了製令號，原本的判斷條件跟著改。）
let saveTimer = null;
const scheduleSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => save(true), 1200); };
const worthSaving = () => ['cust', 'mold', 'spec'].some(k => String(D[k] || '').trim());

function status(text, tone) {
  const el = document.getElementById('hint');
  el.textContent = text;
  el.style.color = tone === 'bad' ? '#B91C1C' : tone === 'ok' ? '#059669' : '';
  el.style.fontWeight = tone ? '700' : '';
}

let saving = false;
async function save(auto) {
  if (saving) { scheduleSave(); return; }
  if (!NO && !worthSaving()) {
    if (!auto) status('請至少填客戶、模具編號或模具規格其中一個，才能建立這一筆', 'bad');
    return;
  }
  saving = true;
  const b = document.getElementById('btnSave');
  b.disabled = true;
  status('儲存中…');
  try {
    if (NO) {
      await update(NO, D);
    } else {
      NO = await create(KIND, D);
      history.replaceState({}, '', '?no=' + encodeURIComponent(NO));
      document.getElementById('noTag').textContent = NO;
      document.getElementById('segKind').style.display = 'none';
    }
    localStorage.removeItem(draftKey());
    dirty = false;
    status('已儲存　' + NO + '　' + new Date().toLocaleTimeString('zh-TW'), 'ok');
    checkPn();
  } catch (e) {
    status('存不進去：' + e.message + '　內容留在這台裝置上，沒有不見', 'bad');
  } finally {
    saving = false; b.disabled = false; markDirty();
  }
}

document.getElementById('bST').addEventListener('click', () => { KIND = 'ST'; D = JSON.parse(localStorage.getItem(draftKey()) || '{}'); render(); });
document.getElementById('bRO').addEventListener('click', () => { KIND = 'RO'; D = JSON.parse(localStorage.getItem(draftKey()) || '{}'); render(); });
document.getElementById('btnNone').addEventListener('click', () => {
  const done = restNone();
  if (!done.length) { status('沒有可以勾「無」的空格了', 'ok'); return; }
  render(); dirty = true; markDirty();
  localStorage.setItem(draftKey(), JSON.stringify(D));
  status('已把 ' + done.length + ' 格空的選項勾成「無」：' + done.join('、') + '　（有做的請自己改回來）', 'ok');
  scheduleSave();
});
document.getElementById('btnPrint').addEventListener('click', () => window.print());
document.getElementById('btnSave').addEventListener('click', () => { clearTimeout(saveTimer); save(false); });

if (await requireLogin()) {
  banner('打完停手一下就會自己存，不用按儲存。上面會顯示「已儲存」和單號', { id: 'form-autosave', plain: true });
  // 抓不到客戶清單也不能擋住填寫——大不了那一格就是純手打
  CUSTS = await meta().then(m => m.customers.map(c => c.v)).catch(() => []);
  if (NO) {
    const rec = await get(NO);
    if (!rec) { alert('查無此單：' + NO); location.href = './'; }
    else {
      D = rec.data; KIND = rec.kind;
      const draft = localStorage.getItem(draftKey());
      if (draft && confirm('這台裝置上有尚未儲存的草稿，要接續編輯嗎？\n（選取消＝使用資料庫上的版本）')) {
        D = JSON.parse(draft); dirty = true;
      }
    }
  } else {
    D = JSON.parse(localStorage.getItem(draftKey()) || '{}');
  }
  render(); markDirty(); checkPn();
}
</script>
