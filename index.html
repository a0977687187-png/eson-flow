<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>製程流動單 · 查詢工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css?v=1788925701">

<div class="shell">

  <!-- 頁首 -->
  <header class="card head">
    <div class="brand">
      <div class="logo"><i data-lucide="layers"></i></div>
      <div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <h1>eson-flow</h1>
          <span class="chipver">FM-PT-01 · B3</span>
        </div>
        <div class="sub">馬達鐵芯 製程流動單　追蹤與查詢工作台</div>
      </div>
    </div>
    <div class="headtools">
      <div class="status">
        <span class="dot-live"></span>
        <span>已連線</span>
        <span class="sep">|</span>
        <span>帳號 <b id="who">—</b></span>
      </div>
      <a class="btn" href="help.html"><i data-lucide="help-circle"></i><span>操作指引</span></a>
      <button class="btn danger" id="btnOut"><i data-lucide="log-out"></i><span>登出</span></button>
    </div>
  </header>

  <!-- 分類頁籤 ＋ 開單 -->
  <section id="topgrid" style="display:grid;grid-template-columns:1.35fr 1fr;gap:14px">
    <div class="card tabs">
      <button class="tab" data-kind="" aria-pressed="true">
        <span class="n">全部流動單</span><span class="c" id="cAll">(0)</span></button>
      <button class="tab" data-kind="ST" aria-pressed="false">
        <span class="n">靜子 ST</span><span class="c" id="cST">(0)</span></button>
      <button class="tab" data-kind="RO" aria-pressed="false">
        <span class="n">轉子 RO</span><span class="c" id="cRO">(0)</span></button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <a class="btn dark lg" style="justify-content:center" href="form.html?kind=ST">
        <i data-lucide="plus-circle"></i><span>＋ 靜子 ST 開單</span></a>
      <a class="btn blue lg" style="justify-content:center" href="form.html?kind=RO">
        <i data-lucide="plus-circle"></i><span>＋ 轉子 RO 開單</span></a>
    </div>
  </section>

  <!-- 主檔累積面板 -->
  <div class="panel">
    <div class="row">
      <div>
        <div class="tagline">
          <span class="ic"><i data-lucide="cpu"></i></span>
          <h2>模具與規格特徵　自動累積</h2>
          <span class="pill" id="pillState">累積中</span>
        </div>
        <p>主檔沒有預先建立——客戶、模具、規格都是這些單自己長出來的。單子還少的時候搜不到東西是正常的。等累積到三、五十張，再回頭看實際出現過哪些組合，那時候才有依據決定「同規格」該怎麼定義。</p>
      </div>
      <div class="gauge">
        <div class="t"><span>已累積流動單</span><b id="gNum">0 / 50 張</b></div>
        <div class="bar"><i id="gBar" style="width:0%"></i></div>
        <div class="f"><span id="gPct">已達成 0%</span><span id="gLeft">還差 50 張</span></div>
      </div>
    </div>
  </div>

  <!-- 搜尋 -->
  <div class="card">
    <div class="searchbar">
      <div class="searchbox">
        <div class="ic"><i data-lucide="search"></i></div>
        <input id="q" type="text" autofocus
          placeholder="打客戶、模具、規格、軸孔…都可以，空白隔開＝要同時符合（例：將凱 90*48 22槽）">
      </div>
      <button class="btn" id="btnReload" title="重新整理"><i data-lucide="refresh-cw"></i></button>
    </div>
    <div class="chips" id="custs"></div>
  </div>

  <!-- 清單 -->
  <div class="card" style="overflow:hidden">
    <div id="body"></div>
    <div class="tfoot">
      <span id="cnt">—</span>
      <span class="mono" style="font-size:11px" id="hintFoot"></span>
    </div>
  </div>

  <footer class="note">
    客戶、模具、規格都不是預先建的主檔，是這些單自己長出來的。<br>
    單子還少的時候搜不到東西是正常的。
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="config.js?v=1788925701"></script>
<script src="fields.js?v=1788925701"></script>
<script type="module">
import { requireLogin, list, meta, logout, currentEmail } from './db.js?v=1788925701';

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id);
const icons = () => { try { lucide.createIcons(); } catch (e) {} };
let KINDF = '', CUSTF = '', ROWS = [], OPEN = null;

// 選配欄位與站別清單都從 FORM 讀——表單改版後這裡自動跟著變
const optFields = kind => FORM[kind].filter(i => i.op === 'field' && i.k.startsWith('o_'))
  .map(i => [i.k, i.l.replace(/\s*[∩φ]\s*$/, '').trim()]);
const stationsOf = kind => (FORM[kind].find(i => i.op === 'stations') || { list: [] }).list;

const stateCls = s => s === '完成' ? 'done' : s === '生產中' ? 'run' : 'wait';
const pctCls = p => p > 85 ? 'hi' : p > 50 ? 'mid' : 'lo';

// 這一段就是「以前怎麼做的」——不必開整張單就看得到
function howMade(r) {
  const d = r.data, bits = [];
  const push = (k, v) => { if (v) bits.push([k, v]); };
  const stations = stationsOf(r.kind);
  const walked = r.stepsUsed.map(i => (stations[i] ? stations[i].name : '?').replace(/\s/g, ''));
  // 沖壓選配只列「有的」——空白與「無」都不顯示。
  // 一張單十幾個選配大多是無，全列出來反而看不到真正的差異在哪。
  // 值就是「有」的（風孔、LOGO 這種），顯示欄位名就夠，不用寫成「風孔 有」。
  const opts = optFields(r.kind).map(([k, l]) => {
    const v = String(d[k] || '').replace(/\|/g, '、').trim();
    if (!v || v === '無') return null;
    return v === '有' ? l : l + ' ' + v;
  }).filter(Boolean);
  // 後製程同理：只列有做的
  const notNone = v => { const s = String(v || '').trim(); return s && s !== '無' ? s : ''; };
  const post = [notNone(d.p_opt), d.p_ring === '有' ? '端環' : '',
                d.p_fan === '有' ? '扇葉/平衡柱' : '', notNone(d.p_other)]
    .filter(Boolean).join('、').replace(/\|/g, '、');

  push('模具', [d.mold, d.spec, d.slots && d.slots + '槽'].filter(Boolean).join('　'));
  push('材質・軸孔・疊厚・斜度', [d.mat, d.shaft && 'φ' + d.shaft, d.stack, d.skew].filter(Boolean).join('　'));
  push('沖壓', [d.press && '沖床 ' + d.press, d.skewset && '斜度設定 ' + d.skewset, d.done && '完成 ' + d.done].filter(Boolean).join('　'));
  push('沖壓選配', opts.join('　'));
  push('走過的站', walked.join(' → ') || '（未填）');
  push('後製程', post);
  push('委外', [d.out1, d.outv].filter(Boolean).join(' / ').replace(/\|/g, '、'));
  push('包裝', [d.boxtype, d.perbox && '每箱 ' + d.perbox, d.boxes && d.boxes + ' 箱'].filter(Boolean).join('　'));
  push('入庫', [d.indate, d.inqty && d.inqty + ' 只', d.inloc].filter(Boolean).join('　'));
  push('製令備註', d.worem);

  return `<div class="detail"><div class="kv">` +
    bits.map(([k, v]) => `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('') +
    `</div><div class="act"><a class="btn dark" href="form.html?no=${encodeURIComponent(r.no)}">
       <i data-lucide="external-link"></i><span>開啟這張單</span></a></div></div>`;
}

function render() {
  $('cnt').textContent = ROWS.length
    ? `顯示 ${ROWS.length} 張` + (CUSTF ? `　·　客戶：${CUSTF}` : '')
    : '沒有符合的單';
  if (!ROWS.length) {
    $('body').innerHTML = `<div class="empty"><b>還沒有符合的流動單</b>
      系統是空的沒關係——它靠現場填進來的單長大。<br>
      按上面「＋ 靜子 ST 開單」或「＋ 轉子 RO 開單」建第一張。</div>`;
    return;
  }
  let h = `<div class="tablewrap"><table class="rows"><thead><tr>
    <th>單號</th><th>類別</th><th>客戶</th><th>模具 / 規格</th><th>槽數</th>
    <th>軸孔</th><th>疊厚</th><th style="text-align:right">數量</th>
    <th>狀態</th><th style="text-align:right">完整度</th><th style="text-align:right">不良</th>
    </tr></thead><tbody>`;
  ROWS.forEach(r => {
    const d = r.data;
    const ic = r.status === '完成' ? 'check-circle' : r.kind === 'RO' ? 'rotate-cw' : 'file-text';
    h += `<tr data-no="${esc(r.no)}"${OPEN === r.no ? ' class="open"' : ''}>
      <td class="no"><span class="ic"><i data-lucide="${ic}"></i></span>${esc(r.no)}</td>
      <td><span class="tag ${r.kind}">${r.kind === 'ST' ? '靜子 ST' : '轉子 RO'}</span></td>
      <td class="strong">${esc(d.cust) || '—'}</td>
      <td><div class="strong">${esc(d.mold) || '—'}</div>
          <div class="mono" style="font-size:11px;color:var(--s400)">${esc(d.spec) || ''}</div></td>
      <td class="mono">${esc(d.slots)}</td>
      <td class="mono">${esc(d.shaft)}</td>
      <td class="mono">${esc(d.stack)}</td>
      <td class="num">${esc(d.qty)}</td>
      <td><span class="state ${stateCls(r.status)}"><i></i>${r.status}</span></td>
      <td class="num"><span class="pct ${pctCls(r.complete)}">${r.complete}%</span></td>
      <td class="num">${r.ngTotal || ''}</td></tr>`;
    if (OPEN === r.no) h += `<tr><td colspan="11" style="padding:0">${howMade(r)}</td></tr>`;
  });
  $('body').innerHTML = h + '</tbody></table></div>';
  document.querySelectorAll('tr[data-no]').forEach(tr => tr.addEventListener('click', () => {
    OPEN = OPEN === tr.dataset.no ? null : tr.dataset.no; render();
  }));
  icons();
}

async function load() {
  try {
    ROWS = await list({ q: $('q').value.trim(), kind: KINDF, cust: CUSTF });
    render();
  } catch (e) {
    $('body').innerHTML = `<div class="empty"><b>讀不到資料</b>${esc(e.message)}</div>`;
  }
}

// 累積進度：「等累積到三、五十張」就是這條的分母
const TARGET = 50;
async function loadMeta() {
  const m = await meta();
  $('cAll').textContent = `(${m.total})`;
  $('cST').textContent = `(${m.byKind.ST || 0})`;
  $('cRO').textContent = `(${m.byKind.RO || 0})`;

  const pct = Math.min(100, Math.round(m.total / TARGET * 100));
  $('gNum').textContent = `${m.total} / ${TARGET} 張`;
  $('gBar').style.width = pct + '%';
  $('gPct').textContent = `已達成 ${pct}%`;
  $('gLeft').textContent = m.total >= TARGET ? '樣本已足夠' : `還差 ${TARGET - m.total} 張`;
  $('pillState').textContent = m.total >= TARGET ? '樣本已足夠' : '累積中';

  $('custs').innerHTML = m.customers.length
    ? m.customers.map(c => `<button class="chip" data-cust="${esc(c.v)}" aria-pressed="${CUSTF === c.v}">${esc(c.v)}<span class="n">${c.n}</span></button>`).join('')
    : '<span style="font-size:12px;color:var(--s400)">客戶清單會隨著單子填進來自動出現，不需要事先建檔。</span>';
  document.querySelectorAll('[data-cust]').forEach(b => b.addEventListener('click', () => {
    CUSTF = CUSTF === b.dataset.cust ? '' : b.dataset.cust;
    document.querySelectorAll('[data-cust]').forEach(x => x.setAttribute('aria-pressed', x.dataset.cust === CUSTF));
    OPEN = null; load();
  }));
  $('hintFoot').textContent = `模具 ${m.molds.length} 套 · 規格 ${m.specs.length} 種 · 客戶 ${m.customers.length} 家`;
}

let timer;
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { OPEN = null; load(); }, 250); });
document.querySelectorAll('[data-kind]').forEach(b => b.addEventListener('click', () => {
  KINDF = b.dataset.kind;
  document.querySelectorAll('[data-kind]').forEach(x => x.setAttribute('aria-pressed', x.dataset.kind === KINDF));
  OPEN = null; load();
}));
$('btnOut').addEventListener('click', logout);
$('btnReload').addEventListener('click', () => { loadMeta(); load(); });

icons();
if (await requireLogin()) {
  $('who').textContent = currentEmail() || '共用帳號';
  await loadMeta();
  await load();
  icons();
}
</script>
