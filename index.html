<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>億新－製程查詢系統</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css?v=1789027173">

<div class="shell">

  <!-- 頁首 -->
  <header class="card head">
    <div class="brand">
      <img class="wordmark" src="logo.png" width="222" height="71" alt="億新精機廠">
      <span class="vline"></span>
      <div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <h1>億新－製程查詢系統</h1>
          <span class="chipver">FM-PT-01 · B4</span>
        </div>
        <div class="sub">馬達鐵芯 產品做法主檔　一筆＝一個成品料號怎麼做</div>
      </div>
    </div>
    <div class="headtools">
      <div class="status">
        <span class="dot-live"></span>
        <span>已連線</span>
        <span class="sep">|</span>
        <span>帳號 <b id="who">—</b></span>
      </div>
      <a class="btn" href="help.html"><i data-lucide="help-circle"></i><span>操作指引</span></a>
      <button class="btn danger" id="btnOut"><i data-lucide="log-out"></i><span>登出</span></button>
    </div>
  </header>

  <!-- 分類頁籤 ＋ 開單 -->
  <section class="topgrid">
    <div class="card tabs">
      <button class="tab" data-kind="" aria-pressed="true">
        <span class="n">全部做法</span><span class="c" id="cAll">(0)</span></button>
      <button class="tab" data-kind="ST" aria-pressed="false">
        <span class="n">靜子 ST</span><span class="c" id="cST">(0)</span></button>
      <button class="tab" data-kind="RO" aria-pressed="false">
        <span class="n">轉子 RO</span><span class="c" id="cRO">(0)</span></button>
    </div>
    <div class="newbtns">
      <a class="btn dark lg" style="justify-content:center" href="form.html?kind=ST">
        <i data-lucide="plus-circle"></i><span>＋ 建立靜子做法</span></a>
      <a class="btn blue lg" style="justify-content:center" href="form.html?kind=RO">
        <i data-lucide="plus-circle"></i><span>＋ 建立轉子做法</span></a>
    </div>
  </section>

  <!-- 主檔累積面板 -->
  <div class="panel">
    <div class="row">
      <div>
        <div class="tagline">
          <span class="ic"><i data-lucide="cpu"></i></span>
          <h2>模具與規格特徵　自動累積</h2>
          <span class="pill" id="pillState">累積中</span>
        </div>
        <p>主檔沒有預先建立——客戶、模具、規格都是這些單自己長出來的。單子還少的時候搜不到東西是正常的。等累積到三、五十張，再回頭看實際出現過哪些組合，那時候才有依據決定「同規格」該怎麼定義。</p>
      </div>
      <div class="gauge">
        <div class="t"><span>已建立做法</span><b id="gNum">0 / 50 張</b></div>
        <div class="bar"><i id="gBar" style="width:0%"></i></div>
        <div class="f"><span id="gPct">已達成 0%</span><span id="gLeft">還差 50 張</span></div>
      </div>
    </div>
  </div>

  <!-- 搜尋 -->
  <div class="card">
    <div class="searchbar">
      <div class="searchbox">
        <div class="ic"><i data-lucide="search"></i></div>
        <input id="q" type="text" autofocus
          placeholder="打客戶、模具、規格、軸孔…都可以，空白隔開＝要同時符合（例：將凱 90*48 22槽）">
      </div>
      <button class="btn" id="btnReload" title="重新整理"><i data-lucide="refresh-cw"></i></button>
    </div>
  </div>

  <!-- 同一個成品料號被打了兩次以上、做法卻不同的，在這裡先攔一次 -->
  <div id="clashbar"></div>

  <!-- 客戶資料夾 -->
  <div class="card" style="overflow:hidden">
    <div id="body"></div>
    <div class="tfoot">
      <span id="cnt">—</span>
      <span class="mono" style="font-size:11px" id="hintFoot"></span>
    </div>
  </div>

  <footer class="note">
    客戶、模具、規格都不是預先建的主檔，是這些單自己長出來的。<br>
    單子還少的時候搜不到東西是正常的。
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="config.js?v=1789027173"></script>
<script src="fields.js?v=1789027173"></script>
<script type="module">
import { requireLogin, list, meta, logout, currentEmail, conflicts } from './db.js?v=1789027173';

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id);
const icons = () => { try { lucide.createIcons(); } catch (e) {} };
let KINDF = '', ROWS = [], OPEN = null;
// 單號 → {pn, clash, others, diff}；同一個成品料號被打了兩次以上才會有東西
let CLASH = new Map();
// 目前展開中的客戶資料夾。沒填客戶的那一組鍵就是空字串。
const OPENC = new Set();

// 選配欄位與站別清單都從 FORM 讀——表單改版後這裡自動跟著變
const optFields = kind => FORM[kind].filter(i => i.op === 'field' && i.k.startsWith('o_'))
  .map(i => [i.k, i.l.replace(/\s*[∩φ]\s*$/, '').trim()]);
const stationsOf = kind => (FORM[kind].find(i => i.op === 'stations') || { list: [] }).list;

const pctCls = p => p > 85 ? 'hi' : p > 50 ? 'mid' : 'lo';
const fmtDay = iso => {
  const d = new Date(iso || 0);
  return isNaN(d) || !iso ? '' : (d.getMonth() + 1) + '/' + d.getDate();
};

const clashTag = no => {
  const c = CLASH.get(no);
  if (!c) return '';
  return c.clash
    ? `<span class="clashtag" title="跟 ${esc(c.others.join('、'))} 同料號但做法不同">做法不一致</span>`
    : `<span class="clashtag dup" title="跟 ${esc(c.others.join('、'))} 同料號、做法相同">重複</span>`;
};

// 撞號的單不一定在目前的篩選結果裡，所以這條橫幅是掃全表的，不跟著搜尋走
function renderClashBar() {
  const bad = [...CLASH.values()].filter(c => c.clash);
  const pns = [...new Set(bad.map(c => c.pn))];
  if (!pns.length) { $('clashbar').innerHTML = ''; return; }
  $('clashbar').innerHTML = `<div class="card clashbar">
    <span class="ic"><i data-lucide="alert-triangle"></i></span>
    <div><b>有 ${pns.length} 個成品料號，同一個號碼被寫成不同的做法</b>
      <div class="pns">${pns.map(p => `<code>${esc(p)}</code>`).join('')}</div>
      <p>下面標「做法不一致」的資料夾點開，會列出差在哪幾欄。</p></div></div>`;
}

// ── 客戶分組 ────────────────────────────────────────────────
// 一家客戶一個資料夾。客戶那一欄是自由文字，所以這裡不做任何歸一——
// 防呆是在填寫頁做的（打字時跳出已有的客戶讓你選），不是在這裡硬併。
function groupRows(rows) {
  const m = new Map();
  for (const r of rows) {
    const c = String(r.data.cust || '').trim();
    if (!m.has(c)) m.set(c, []);
    m.get(c).push(r);
  }
  const out = [...m].map(([cust, list]) => ({
    cust, list,
    st: list.filter(r => r.kind === 'ST').length,
    ro: list.filter(r => r.kind === 'RO').length,
    specs: [...new Set(list.map(r => String(r.data.spec || '').trim()).filter(Boolean))],
    updated: list.reduce((a, r) => (r.updated > a ? r.updated : a), ''),
    bad: list.some(r => (CLASH.get(r.no) || {}).clash),
  }));
  // 沒填客戶的排最上面（那是待補的，不是一家客戶），其餘筆數多的在上
  out.sort((a, b) => (a.cust === '' ? -1 : b.cust === '' ? 1 : 0)
    || b.list.length - a.list.length
    || a.cust.localeCompare(b.cust, 'zh-Hant'));
  return out;
}

function folderHead(g, open) {
  const shown = g.specs.slice(0, 3).map(s => `<b>${esc(s)}</b>`).join('、');
  const more = g.specs.length > 3 ? ` +${g.specs.length - 3}` : '';
  return `<button class="fhead" data-cust="${esc(g.cust)}" aria-expanded="${open}">
    <span class="chev"><i data-lucide="chevron-right"></i></span>
    <span class="fname${g.cust ? '' : ' none'}">${g.cust ? esc(g.cust) : '（還沒填客戶）'}</span>
    <span class="fcount">做法 ${g.list.length} 筆</span>
    <span class="fkinds">ST ${g.st} · RO ${g.ro}</span>
    <span class="fspecs">${g.specs.length ? '規格 ' + shown + more : ''}</span>
    ${g.bad ? '<span class="clashtag">做法不一致</span>' : ''}
    <span class="fupd">${esc(fmtDay(g.updated))}</span>
  </button>`;
}

// 有值才掛 data-l：手機上那個欄位名是用 CSS 的 ::before 補的，
// 沒值的格子連標籤都不要出現，不然一堆「材質」「軸孔」後面空空的。
const cell = (cls, label, html) =>
  `<span class="${cls}"${html ? ` data-l="${esc(label)}"` : ''}>${html}</span>`;

function rowHtml(r) {
  const d = r.data;
  const ic = r.kind === 'RO' ? 'rotate-cw' : 'file-text';
  const mold = (d.mold || d.spec)
    ? `<b>${esc(d.mold) || '—'}</b><i>${esc(d.spec)}</i>` : '';
  return `<div class="rrow${OPEN === r.no ? ' open' : ''}" data-no="${esc(r.no)}">
    <span class="c-no"><span class="ic"><i data-lucide="${ic}"></i></span>${esc(r.no)}</span>
    <span class="c-kind"><span class="tag ${r.kind}">${r.kind === 'ST' ? '靜子 ST' : '轉子 RO'}</span></span>
    ${cell('c-mold', '模具', mold)}
    ${cell('c-slots mono', '槽數', esc(d.slots))}
    ${cell('c-mat mono', '材質', esc(d.mat))}
    ${cell('c-shaft mono', '軸孔', esc(d.shaft))}
    ${cell('c-stack mono', '疊厚', esc(d.stack))}
    ${cell('c-cpn mono', '客戶料號', esc(d.custpn))}
    ${cell('c-fpn mono', '成品料號', esc(d.pnfin) + clashTag(r.no))}
    <span class="c-pct" data-l="完整度"><span class="pct ${pctCls(r.complete)}"${r.missing.length
      ? ` title="還沒答：${esc(r.missing.join('、'))}"` : ''}>${r.complete}%</span></span>
  </div>`;
}

const RHEAD = `<div class="rhead"><span>編號</span><span>類別</span><span>模具 / 規格</span>
  <span>槽數</span><span>材質</span><span>軸孔</span><span>疊厚</span>
  <span>客戶料號</span><span>成品料號</span><span>完整度</span></div>`;

// 這一段就是「以前怎麼做的」——不必開整張單就看得到
function howMade(r) {
  const d = r.data, bits = [];
  // wide＝整列：Know-how 那種長文字塞在半格裡會擠成一條
  const push = (k, v, wide) => { if (v) bits.push([k, v, wide]); };
  const stations = stationsOf(r.kind);
  const walked = r.stepsUsed.map(i => (stations[i] ? stations[i].name : '?').replace(/\s/g, ''));
  // 沖壓選配只列「有的」——空白與「無」都不顯示。
  // 一張單十幾個選配大多是無，全列出來反而看不到真正的差異在哪。
  // 值就是「有」的（風孔、LOGO 這種），顯示欄位名就夠，不用寫成「風孔 有」。
  const opts = optFields(r.kind).map(([k, l]) => {
    const v = String(d[k] || '').replace(/\|/g, '、').trim();
    if (!v || v === '無') return null;
    return v === '有' ? l : l + ' ' + v;
  }).filter(Boolean);
  // 後製程同理：只列有做的
  const notNone = v => { const s = String(v || '').trim(); return s && s !== '無' ? s : ''; };
  // 9/10 轉子的端環、扇葉改成手打（寫實際規格）。舊資料還是「有」的，就只顯示名稱。
  const named = (label, v) => { const s = notNone(v); return !s ? '' : s === '有' ? label : label + ' ' + s; };
  const post = [notNone(d.p_opt), named('端環', d.p_ring), named('扇葉/平衡柱', d.p_fan),
                notNone(d.p_other)]
    .filter(Boolean).join('、').replace(/\|/g, '、');

  push('模具', [d.mold, d.spec, d.slots && d.slots + '槽'].filter(Boolean).join('　'));
  push('料號', [d.pnfin && '成品 ' + d.pnfin, d.custpn && '客戶 ' + d.custpn].filter(Boolean).join('　'));
  push('材質・軸孔・疊厚・斜度', [d.mat, d.shaft && 'φ' + d.shaft, d.stack, d.skew].filter(Boolean).join('　'));
  push('積層・廠別', [d.form, d.plant].filter(Boolean).join('　'));
  push('沖壓', [d.press && '沖床 ' + d.press, d.skewset && '斜度設定 ' + d.skewset].filter(Boolean).join('　'));
  push('沖壓選配', opts.join('　'));
  push('沖壓備註', d.press_note, true);
  push('走過的站', walked.join(' → ') || '（未填）');
  // 各站的 Know-how 才是「下次照同樣方法做」的關鍵：一站一行、全文列出
  push('各站重點', stations.map((s, i) => {
    const t = String(d['st' + i + '_eq'] || '').trim();
    return t ? s.name.replace(/\s/g, '') + '：' + t : '';
  }).filter(Boolean).join('\n'), true);
  push('後製程', post);
  push('後製程備註', d.post_note, true);
  push('委外', [d.out1, d.outv].filter(Boolean).join(' / ').replace(/\|/g, '、'));
  push('委外備註', d.out_note, true);
  push('包裝', [d.boxtype, d.perbox && '每箱 ' + d.perbox, d.packway, d.labeltxt && '標籤 ' + d.labeltxt].filter(Boolean).join('　'));
  push('包裝備註', d.pack_note, true);
  push('送貨地點', d.shipto);
  push('其他備註', d.worem, true);
  // 完整度差在哪，直接列出來——不然只看到 78% 也不知道要補什麼
  push('還沒答', r.missing.length ? r.missing.join('、') : '（都答完了）');

  return `<div class="detail">${clashBox(r)}<div class="kv">` +
    bits.map(([k, v, wide]) => `<div${wide ? ' class="wide"' : ''}><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('') +
    `</div><div class="act"><a class="btn dark" href="form.html?no=${encodeURIComponent(r.no)}">
       <i data-lucide="external-link"></i><span>開啟這張單</span></a></div></div>`;
}

// 同一個成品料號打了兩次以上：做法不同就攤開差在哪一欄，做法一樣就只提醒重複
function clashBox(r) {
  const c = CLASH.get(r.no);
  if (!c) return '';
  const who = c.others.join('、');
  if (!c.clash) {
    return `<div class="warnbox dup"><b>成品料號 ${esc(c.pn)} 重複</b>
      跟 ${esc(who)} 是同一個料號、做法也一樣。要留兩筆還是刪一筆，你決定。</div>`;
  }
  return `<div class="warnbox"><b>成品料號 ${esc(c.pn)} 撞號，但做法不一樣</b>
    跟 ${esc(who)} 用同一個成品料號，下面這 ${c.diff.length} 個地方寫得不同——
    一定有一邊是錯的，或是這兩個本來就該分成不同料號。
    <table class="difftab"><thead><tr><th>欄位</th><th>${esc(r.no)}</th><th>${esc(c.others[0])}</th></tr></thead>
    <tbody>${c.diff.map(x => `<tr><td>${esc(x.label)}</td><td>${esc(x.a)}</td><td>${esc(x.b)}</td></tr>`).join('')}</tbody>
    </table></div>`;
}

function render() {
  const groups = groupRows(ROWS);
  // 只有一家的時候不必再叫人點一下
  if (groups.length === 1) OPENC.add(groups[0].cust);

  $('cnt').textContent = ROWS.length
    ? `${groups.length} 家客戶　·　共 ${ROWS.length} 筆做法`
    : '沒有符合的單';
  if (!ROWS.length) {
    $('body').innerHTML = `<div class="empty"><b>還沒有符合的做法</b>
      系統是空的沒關係——它靠現場填進來的單長大。<br>
      按上面「＋ 建立靜子做法」或「＋ 建立轉子做法」建第一張。</div>`;
    return;
  }
  $('body').innerHTML = groups.map(g => {
    const open = OPENC.has(g.cust);
    const inner = open
      ? RHEAD + g.list.map(r => rowHtml(r) + (OPEN === r.no ? howMade(r) : '')).join('')
      : '';
    return `<div class="folder${open ? ' open' : ''}">${folderHead(g, open)}${inner}</div>`;
  }).join('');

  document.querySelectorAll('.fhead').forEach(b => b.addEventListener('click', () => {
    const c = b.dataset.cust;
    if (OPENC.has(c)) { OPENC.delete(c); OPEN = null; } else { OPENC.add(c); }
    render();
  }));
  document.querySelectorAll('.rrow').forEach(el => el.addEventListener('click', () => {
    OPEN = OPEN === el.dataset.no ? null : el.dataset.no; render();
  }));
  icons();
}

async function load() {
  try {
    ROWS = await list({ q: $('q').value.trim(), kind: KINDF });
    // 搜尋的時候把有命中的客戶自動打開，不然只看到一排收合的資料夾
    if ($('q').value.trim()) groupRows(ROWS).forEach(g => OPENC.add(g.cust));
    render();
  } catch (e) {
    $('body').innerHTML = `<div class="empty"><b>讀不到資料</b>${esc(e.message)}</div>`;
  }
}

// 累積進度：「等累積到三、五十張」就是這條的分母
const TARGET = 50;
async function loadMeta() {
  CLASH = await conflicts().catch(() => new Map());
  renderClashBar();
  const m = await meta();
  $('cAll').textContent = `(${m.total})`;
  $('cST').textContent = `(${m.byKind.ST || 0})`;
  $('cRO').textContent = `(${m.byKind.RO || 0})`;

  const pct = Math.min(100, Math.round(m.total / TARGET * 100));
  $('gNum').textContent = `${m.total} / ${TARGET} 張`;
  $('gBar').style.width = pct + '%';
  $('gPct').textContent = `已達成 ${pct}%`;
  $('gLeft').textContent = m.total >= TARGET ? '樣本已足夠' : `還差 ${TARGET - m.total} 張`;
  $('pillState').textContent = m.total >= TARGET ? '樣本已足夠' : '累積中';

  $('hintFoot').textContent = `模具 ${m.molds.length} 套 · 規格 ${m.specs.length} 種 · 客戶 ${m.customers.length} 家`;
}

let timer;
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { OPEN = null; load(); }, 250); });
document.querySelectorAll('[data-kind]').forEach(b => b.addEventListener('click', () => {
  KINDF = b.dataset.kind;
  document.querySelectorAll('[data-kind]').forEach(x => x.setAttribute('aria-pressed', x.dataset.kind === KINDF));
  OPEN = null; load();
}));
$('btnOut').addEventListener('click', logout);
$('btnReload').addEventListener('click', () => { loadMeta(); load(); });

icons();
if (await requireLogin()) {
  $('who').textContent = currentEmail() || '共用帳號';
  await loadMeta();
  await load();
  icons();
}
</script>
